name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: 'read'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Determine environment variables based on branch
      - name: Set Environment Variables
        run: |
          echo "CF_PROJECT_NAME=${{ vars.CF_PAGES_PROJECT_NAME || 'careerkinetic-web' }}" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "CF_BRANCH=main" >> $GITHUB_ENV
            echo "VITE_API_URL=${{ secrets.PROD_API_URL }}" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
            echo "CF_BRANCH=dev" >> $GITHUB_ENV
            echo "VITE_API_URL=${{ secrets.DEV_API_URL }}" >> $GITHUB_ENV
          fi

      # Build frontend React SPA
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      # Ensure Cloudflare Pages project exists before deploying
      - name: Ensure Pages Project Exists
        run: |
          npx wrangler pages project create "${{ env.CF_PROJECT_NAME }}" --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy static output (dist) to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist \
            --project-name="${{ env.CF_PROJECT_NAME }}" \
            --branch="${{ env.CF_BRANCH }}" \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
